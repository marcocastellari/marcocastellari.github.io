baseURL: 'https://marcocastellari.github.io'
languageCode: en-us
title: "Marco Castellari"
theme: PaperMod

# Enable Git info for last modified dates
enableGitInfo: false

# Enable emoji support
enableEmoji: true

# Build settings
buildDrafts: false
buildFuture: false
buildExpired: false

# Pagination
pagination:
  pagerSize: 10

# Minify output
minify:
  disableXML: true
  minifyOutput: true

# Language settings
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

# Permalinks
permalinks:
  posts: "/posts/:year/:month/:title/"
  projects: "/projects/:title/"

# Taxonomies
taxonomies:
  category: categories
  tag: tags
  series: series
  topic: topics
  # subtopic: subtopics

# Markup settings
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github-dark
    lineNos: true
    lineNumbersInTable: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    hl_Lines: ""
    noClasses: false
    tabWidth: 4

# Privacy settings
privacy:
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: true
    useSessionStorage: true
  x:
    disable: false
    enableDNT: true
    simple: true

# Services
services:
  googleAnalytics:
    ID: # Add your Google Analytics ID

# Site parameters
params:
  env: production
  title: "Marco's Blog"
  description: "Electronic Engineer & Software Enthusiast"
  keywords: [Electronc Engineer, Software Engineering, Programming, Technology, Blog]
  author: Marco
  
  # Profile settings
  profileMode:
    enabled: true
    title: "Hi, I'm Marco!"
    subtitle: "Electronic Engineer & Software Enthusiast"
    imageUrl: "images/profile-picture.png"
    imageWidth: 150
    imageHeight: 150
    imageTitle: Marco
    buttons:
      - name: About
        url: /about
      - name: Projects
        url: /projects
      - name: Resume
        url: /files/cv_Marco_Castellari.pdf

  # Home page settings
  homeInfoParams:
    Title: "Welcome to my corner of the internet"
    Content: >
      I'm a passionate electronic engineer who loves building innovative solutions 
      and sharing knowledge through writing. Explore my projects, read my thoughts 
      on technology, and feel free to connect!

  # Social icons
  socialIcons:
    - name: github
      url: "https://github.com/marcocastellari"
    - name: linkedin
      url: "https://linkedin.com/in/marco-castellari01"
    - name: email
      url: "marco.castellari01@gmail.com"
    - name: rss
      url: "/index.xml"

  # Search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  # Theme settings
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  # SEO and analytics
  analytics:
    google:
      SiteVerificationTag: ""
  
  # Cover image settings
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  # Edit post settings
  editPost:
    URL: "https://github.com/marcocastellari/marcocastellari.github.io/tree/main/content"
    Text: "Suggest Changes"
    appendFilePath: true

# Menu configuration
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30
    - identifier: posts
      name: Blog
      url: /posts/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50
    # - identifier: tags
    #   name: Tags
    #   url: /tags/
    #   weight: 60

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Security
security:
  enableInlineShortcodes: false
  exec:
    allow: ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', '^git$']
    osEnv: ['(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$']
  funcs:
    getenv: ['^HUGO_']
  http:
    methods: ['(?i)GET|POST']
    urls: ['.*']
