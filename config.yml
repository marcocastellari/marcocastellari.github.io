baseURL: 'https://marcocastellari.github.io'
languageCode: en-us
title: "Marco Castellari"
author: "Marco Castellari"
theme: PaperMod

# Enable Git info for last modified dates
enableGitInfo: false

# Enable emoji support
enableEmoji: true

# Build settings
buildDrafts: false
buildFuture: false
buildExpired: false

# Pagination
pagination:
  pagerSize: 10

# Minify output
minify:
  disableXML: true
  minifyOutput: true

# Language settings
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

# Permalinks intentionally left at Hugo's defaults: /<section>/<filename>/.
# Dates in article URLs make evergreen technical writing look stale and break
# when a post is revised.

# Taxonomies
taxonomies:
  tag: tags
  series: series

# Markup settings
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github-dark
    lineNos: true
    lineNumbersInTable: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    hl_Lines: ""
    noClasses: false
    tabWidth: 4

# Privacy settings
privacy:
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: true
    useSessionStorage: true
  x:
    disable: false
    enableDNT: true
    simple: true

# Services
services:
  googleAnalytics:
    ID: # Add your Google Analytics ID

# Site parameters
params:
  env: production
  title: "Marco Castellari"
  description: "Electronics & Software Engineer building systems from the board up - PCBs, real-time firmware, C++ applications, and CI tooling."
  keywords: [Embedded Systems, Firmware, C++, PCB Design, CI/CD, Real-Time, Marco Castellari]
  author: "Marco Castellari"
  mainSections: ["articles", "projects"]

  # Homepage hero copy lives in content/_index.md

  # Header wordmark
  label:
    text: "Marco Castellari"

  # Profile settings (disabled — the About page carries this)
  profileMode:
    enabled: false

  # Social icons
  socialIcons:
    - name: github
      url: "https://github.com/marcocastellari"
    - name: linkedin
      url: "https://linkedin.com/in/marco-castellari01"
    - name: rss
      url: "/index.xml"

  # Search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  # Theme settings
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false # avoid social network share buttons
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  # SEO and analytics
  analytics:
    google:
      SiteVerificationTag: ""

  # Cover image settings
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  # Edit post settings
  editPost:
    URL: "https://github.com/marcocastellari/marcocastellari.github.io/tree/main/content"
    Text: "Suggest Changes"
    appendFilePath: true

# Menu configuration
menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: articles
      name: Writing
      url: /articles/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Security
security:
  enableInlineShortcodes: false
  exec:
    allow: ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', '^git$']
    osEnv: ['(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$']
  funcs:
    getenv: ['^HUGO_']
  http:
    methods: ['(?i)GET|POST']
    urls: ['.*']
