{{- $tech := .Get 0 -}}
{{- $color := .Get 1 | default "blue" -}}
<span class="tech-badge tech-badge-{{ $color }}">{{ $tech }}</span>

<style>
.tech-badge {
    display: inline-block;
    padding: 0.25rem 0.5rem;
    margin: 0.125rem;
    border-radius: 0.375rem;
    font-size: 0.875rem;
    font-weight: 500;
    white-space: nowrap;
}

.tech-badge-blue {
    background-color: #dbeafe;
    color: #1e40af;
}

.tech-badge-green {
    background-color: #dcfce7;
    color: #166534;
}

.tech-badge-purple {
    background-color: #f3e8ff;
    color: #7c3aed;
}

.tech-badge-red {
    background-color: #fee2e2;
    color: #dc2626;
}

.tech-badge-yellow {
    background-color: #fef3c7;
    color: #d97706;
}

[data-theme="dark"] .tech-badge-blue {
    background-color: #1e3a8a;
    color: #93c5fd;
}

[data-theme="dark"] .tech-badge-green {
    background-color: #14532d;
    color: #86efac;
}

[data-theme="dark"] .tech-badge-purple {
    background-color: #581c87;
    color: #c4b5fd;
}

[data-theme="dark"] .tech-badge-red {
    background-color: #991b1b;
    color: #fca5a5;
}

[data-theme="dark"] .tech-badge-yellow {
    background-color: #92400e;
    color: #fcd34d;
}
</style>
