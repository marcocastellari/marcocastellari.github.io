{{- define "main" }}

<header class="page-header">
  {{- partial "breadcrumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{- with .Description }}
  <div class="post-description">{{ . | markdownify }}</div>
  {{- end }}
</header>

{{- with .Content }}
<div class="post-content">{{ . }}</div>
{{- end }}

<div class="home-grid">
  {{- range .Pages.ByDate.Reverse }}
  {{- partial "entry-card.html" . }}
  {{- end }}
</div>

{{- end }}{{- /* end main */ -}}
